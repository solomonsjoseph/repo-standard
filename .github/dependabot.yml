version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies]
    groups:
      hooks:
        patterns: ["*"]
# LANGUAGE ECOSYSTEMS (added by overlay)
# repo-standard only (check-drift.sh allows lines after the marker): the ts
# overlay's package.json, so new repos start from current versions. The
# python overlay has no lock file, which Dependabot's uv support needs.
  - package-ecosystem: npm
    directory: /overlays/ts
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
      include: scope
    labels: [dependencies]
    # Same hold as the overlay's own config: typescript-eslint 8 supports
    # TypeScript below 6.1 only.
    ignore:
      - dependency-name: typescript
        versions: [">=6.1"]
    # Minor and patch updates in one pull request. Nothing in this repo's CI
    # installs or tests the overlay, so a major update (as in #8) stays a
    # separate pull request that is tried by hand on a new repo first.
    groups:
      overlay-ts:
        patterns: ["*"]
        update-types: [minor, patch]
