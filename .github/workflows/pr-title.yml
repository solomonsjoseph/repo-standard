# Required check: "pr-title". The squash commit takes the PR title as its
# subject and the PR body as its message, so the title must be a valid
# Conventional Commit and the body must not carry AI attribution lines
# (STANDARD.md section 5), which local hooks never see.
name: pr-title

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
          # Subject starts lowercase (Angular style).
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" in "{title}" must start with a lowercase letter.
      - name: Check the PR body for AI attribution lines
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # Co-Authored-By trailers that name an AI tool, and tool footers such
          # as "Generated with Claude Code". Human co-authors stay allowed.
          pattern='^[[:space:]]*co-authored-by:.*(claude|anthropic|copilot|openai|chatgpt|gemini|cursor|codex|devin)|generated (with|by) .*(claude|copilot|chatgpt|gemini|cursor|codex)'
          if printf '%s\n' "$BODY" | grep -Eiq "$pattern"; then
            echo "::error::Remove AI attribution lines from the PR body (STANDARD.md section 5); the squash commit message is taken from it."
            printf '%s\n' "$BODY" | grep -Ein "$pattern" || true
            exit 1
          fi
