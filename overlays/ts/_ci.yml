# Required check: the "ci" job (aggregate). Overlay: ts.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hooks:
    name: hooks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SKIP: no-commit-to-branch,prettier,gofmt,swift-format
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # Hook environments (Vale, gitleaks, actionlint build from source) are
      # cached per config so CI does not rebuild or re-download them each run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit hooks (lint, format, docs, links, secrets, ASCII)
        env:
          # Retrofitted repos set VALE_SCOPE to "changed" so Vale checks only
          # the files a PR touches; new repos check everything.
          VALE_SCOPE: all
          BASE_REF: ${{ github.base_ref }}
        run: |
          python -m pip install --disable-pip-version-check "pre-commit==4.7.0"
          if [ "$VALE_SCOPE" = changed ]; then
            # Retrofitted repos: Vale checks only the files a PR touches, and
            # pushes to main skip Vale (their PR was already checked).
            SKIP="$SKIP,vale" pre-commit run --all-files --show-diff-on-failure
            if [ -n "$BASE_REF" ]; then
              # fetch-depth 0 already has origin/<base>; no extra fetch needed.
              pre-commit run vale --from-ref "origin/$BASE_REF" --to-ref HEAD
            fi
          else
            pre-commit run --all-files --show-diff-on-failure
          fi

  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Format check
        run: pnpm run format:check
      - name: Type check
        run: pnpm run typecheck
      - name: Test with coverage
        run: pnpm run test:coverage
      - name: Build
        run: pnpm run build

  # Secret scan of the commits themselves. The gitleaks pre-commit hook only
  # sees staged files, so it protects local commits but finds nothing in CI.
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action lists the PR's commits through the API.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          # Pin the scanner itself; the action downloads "latest" otherwise.
          GITLEAKS_VERSION: 8.30.1

  # Aggregate job. The ruleset requires only this check. It always runs and
  # fails unless every job it needs succeeded, so a skipped or cancelled job
  # can never count as a pass. Add every new job to "needs".
  ci:
    name: ci
    if: always()
    needs: [hooks, secrets, test]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check that every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "a required job finished with: $r"
              exit 1
            fi
          done
