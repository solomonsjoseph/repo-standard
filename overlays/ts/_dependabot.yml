  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    labels: [dependencies]
    # One PR per group, so a week of bumps is one patch release, not many.
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
