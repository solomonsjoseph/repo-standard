[project]
name = "__REPO_NAME__"
version = "0.0.0"
description = "__DESCRIPTION__"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "mypy>=1.13", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/__PKG__"]

[tool.uv]
# Cooldown (STANDARD.md section 9): resolve only releases at least a week
# old. A security fix newer than that needs a per-package exception:
# exclude-newer-package = { name = false }
exclude-newer = "1 week"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Google Python style guide via ruff: pycodestyle, pyflakes, isort, naming,
# docstrings (google convention), bugbear, pyupgrade, simplify, and the
# flake8-bandit security rules (S).
select = ["E", "F", "W", "I", "N", "D", "B", "UP", "SIM", "RUF", "S"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests use assert (S101) by design.
"tests/**" = ["D", "S101"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
