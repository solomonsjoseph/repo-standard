# Required check: the "ci" job (aggregate). Overlay: go.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hooks:
    name: hooks
    runs-on: ubuntu-latest
    timeout-minutes: 30  # a cold cache builds every hook
    permissions:
      contents: read
    env:
      SKIP: no-commit-to-branch,prettier,gofmt,swift-format
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # Hook environments (Vale, gitleaks, actionlint build from source) are
      # cached per config so CI does not rebuild or re-download them each run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit hooks (lint, format, docs, links, secrets, ASCII)
        env:
          # Retrofitted repos set HOOKS_SCOPE to "changed": every hook checks
          # only the files a PR (or a push to main) touches, so content that
          # predates the standard is fixed as it is edited, not all at once.
          # New repos check everything.
          HOOKS_SCOPE: all
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          python -m pip install --disable-pip-version-check "pre-commit==4.7.0"
          if [ "$HOOKS_SCOPE" != changed ]; then
            pre-commit run --all-files --show-diff-on-failure
          elif [ -n "$BASE_REF" ]; then
            # fetch-depth 0 already has origin/<base>; no extra fetch needed.
            pre-commit run --from-ref "origin/$BASE_REF" --to-ref HEAD --show-diff-on-failure
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            pre-commit run --from-ref "$BEFORE" --to-ref HEAD --show-diff-on-failure
          else
            echo "HOOKS_SCOPE=changed and no base commit (manual run or new branch); hooks skipped"
          fi

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Test with race detector and coverage
        run: |
          go test -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -n 1
      - name: Build
        run: go build ./...

  # Secret scan of the commits themselves. The gitleaks pre-commit hook only
  # sees staged files, so it protects local commits but finds nothing in CI.
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # gitleaks-action lists the PR's commits through the API.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          # Pin the scanner itself; the action downloads "latest" otherwise.
          GITLEAKS_VERSION: 8.30.1

  # Aggregate job. The ruleset requires only this check. It always runs and
  # fails unless every job it needs succeeded, so a skipped or cancelled job
  # can never count as a pass. Add every new job to "needs".
  ci:
    name: ci
    if: always()
    needs: [hooks, secrets, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check that every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "a required job finished with: $r"
              exit 1
            fi
          done
